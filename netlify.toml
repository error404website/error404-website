# Netlify configuration for the ERROR_404 site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Source Vault server side: the key check, encrypted data and stem links (netlify/functions/vault-*.mjs)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/vault/*"
  [headers.values]
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"

# Hashed JS/CSS bundles never change once published, so they can be cached forever.
[[headers]]
  for = "/_app/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Tracks and images keep their names when replaced, so cache them for a while but not forever.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Keep the site out of search engines, AI search/training and archives on every response
# (pages, audio, images and the netlify.app domains too); it's shared by direct link only.
# robots.txt and the robots meta tag say the same; tdm-reservation opts out of text and data mining.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"
    tdm-reservation = "1"
