# Netlify configuration for the ERROR_404 site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Source Vault: the stems function (netlify/functions/vault-stems.mjs; needs VAULT_GH_TOKEN)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/vault/*"
  [headers.values]
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"

# Live show (/live/): private like the vault; the instrumentals are encrypted and never change name
[[headers]]
  for = "/live/*"
  [headers.values]
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/live/inst/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/live/patch/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Hashed JS/CSS bundles never change once published, so they can be cached forever.
[[headers]]
  for = "/_app/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Tracks and images keep their names when replaced, so cache them for a while but not forever.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security headers for every page.
# HSTS: browsers use https for error404.run and every subdomain (www too) for two years, even when a
# link says http://. "preload" makes it eligible for the browsers' built-in https list (hstspreload.org).
# upgrade-insecure-requests: any stray http:// file on a page is fetched over https instead.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Keep the site out of search engines, AI search/training and archives on every response
# (pages, audio, images and the netlify.app domains too); it's shared by direct link only.
# robots.txt and the robots meta tag say the same; tdm-reservation opts out of text and data mining.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"
    tdm-reservation = "1"
