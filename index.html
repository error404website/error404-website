<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030409" />
    <!-- Fluid site scale: 100% up to 1280px wide, easing to 85% at 1920px+. ?zoom=0.9 overrides for testing. -->
    <script>
      (function () {
        var d = document.documentElement,
          f = parseFloat(new URLSearchParams(location.search).get("zoom"));
        function s() {
          var z = f > 0 && f <= 1 ? f : Math.max(0.85, Math.min(1, 1 - ((innerWidth - 1280) * 0.15) / 640));
          z = Math.round(z * 1000) / 1000;
          d.style.zoom = z === 1 ? "" : z;
          d.style.setProperty("--ez", z);
        }
        s();
        addEventListener("resize", s);
      })();
    </script>
    <script>
      document.documentElement.classList.add("fx-pending");
      setTimeout(function () {
        if (!window.__efx) document.documentElement.classList.remove("fx-pending");
      }, 2500);
    </script>

    <!-- Primary -->
    <title>ARCHIVE_404 — the debut project from ERROR_404</title>
    <link rel="canonical" href="https://error404.run/" />
    <meta
      name="description"
      content="Something survived the crash. 4 chapters, 20 recovered files, free to download. Book ERROR_404 for live audiovisual shows."
    />
    <meta
      name="keywords"
      content="ERROR_404, ARCHIVE_404, UK Grime, Future Garage, Hyperpop Metal, UK music, cinematic album, alternative, electronic"
    />
    <meta name="author" content="ERROR_404" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://error404.run/" />
    <meta property="og:site_name" content="ERROR_404" />
    <meta property="og:title" content="ARCHIVE_404 — the debut project from ERROR_404" />
    <meta
      property="og:description"
      content="Something survived the crash. 4 chapters, 20 recovered files, free to download. Book ERROR_404 for live audiovisual shows."
    />
    <meta property="og:image" content="https://error404.run/assets/og-image-v2.png" />
    <meta
      property="og:image:alt"
      content="ERROR_404 logo beside the line Something survived the crash — 4 chapters, 20 files, free"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ARCHIVE_404 — the debut project from ERROR_404" />
    <meta
      name="twitter:description"
      content="Something survived the crash. 4 chapters, 20 recovered files, free to download. Book ERROR_404 for live audiovisual shows."
    />
    <meta name="twitter:image" content="https://error404.run/assets/og-image-v2.png" />

    <link rel="preload" href="/fonts/bebas-neue-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Preload hero assets DURING the boot sequence so they're decoded and
         ready the instant the Hero mounts — no post-boot download/decode jank -->
    <link
      rel="preload"
      href="/assets/ARCHIVE_404_HERO3.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/assets/error404logo.svg"
      as="image"
      type="image/svg+xml"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script defer src="/assets/logo-fx.js"></script>
  </head>
  <body>
    <!-- Hidden static form so Netlify detects "contact" + its fields at deploy
         time (the real form is rendered by React and POSTed via fetch). -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="callsign" />
      <input type="email" name="email" />
      <input type="text" name="venue" />
      <input type="text" name="location" />
      <input type="date" name="date" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
