name: Bug report
description: Something on the site is broken or looks wrong
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where on the site?
      placeholder: e.g. Catalogue → THE FEED player, mobile menu, download box
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Desktop, Tablet, Phone]
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Safari 26 on macOS, Chrome 140 on Android
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording
      description: Drag images or videos in here if you have them.
